<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="diff-add" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="diff-del" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
      }
      @keyframes pulseOrb2 {
        0%, 100% { transform: scale(1.1) translate(0px, 0px); opacity: 0.3; }
        50% { transform: scale(0.9) translate(-20px, 20px); opacity: 0.55; }
      }
      @keyframes scanline {
        0% { transform: translateY(-40px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      @keyframes floatGitNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes radarLine {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 250px; }
      .scanner { animation: scanline 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .git-node { animation: floatGitNode 4s ease-in-out infinite; }
      .git-wire { stroke-dasharray: 12 6; animation: radarLine 25s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Glowing Ambience in Background -->
  <g opacity="0.8">
    <circle class="orb-1" cx="220" cy="110" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="orb-2" cx="980" cy="240" r="160" fill="#a855f7" filter="url(#glow)" />
    <circle cx="620" cy="60" r="100" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />
  </g>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" />
  </g>

  <!-- Dynamic Diff Graphic & Git Branches (Right Wing Background) -->
  <g opacity="0.35" transform="translate(780, 50)">
    <!-- Git Branch lines -->
    <path class="git-wire" d="M 50,40 C 120,40 140,110 210,110 L 320,110" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path class="git-wire" d="M 50,180 C 130,180 150,110 210,110" fill="none" stroke="#ec4899" stroke-width="3" />
    <path class="git-wire" d="M 210,110 L 350,110 C 380,110 390,70 420,70" fill="none" stroke="#10b981" stroke-width="3" />

    <!-- Commit Nodes -->
    <circle class="git-node" cx="50" cy="40" r="7" fill="#38bdf8" />
    <circle class="git-node" cx="50" cy="180" r="7" fill="#ec4899" />
    <circle class="git-node" cx="210" cy="110" r="9" fill="#818cf8" stroke="#ffffff" stroke-width="2" />
    <circle class="git-node" cx="320" cy="110" r="7" fill="#10b981" />
  </g>

  <!-- Left Side Dynamic Diff Code Snippet Display Window -->
  <g transform="translate(60, 50)">
    <!-- Terminal Box -->
    <rect width="360" height="230" rx="10" fill="#030712" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.5" />
    <!-- Window Controls -->
    <circle cx="22" cy="20" r="5" fill="#ef4444" />
    <circle cx="38" cy="20" r="5" fill="#eab308" />
    <circle cx="54" cy="20" r="5" fill="#10b981" />
    <text x="75" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">visual-diff-viewer.tsx</text>

    <!-- Side-by-side diff blocks -->
    <g transform="translate(15, 45)">
      <!-- Left side (removed) -->
      <rect x="0" y="0" width="160" height="26" rx="4" fill="url(#diff-del)" />
      <text x="8" y="17" fill="#f87171" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">- const mode = "2-way";</text>

      <rect x="0" y="32" width="160" height="26" rx="4" fill="url(#diff-del)" />
      <text x="8" y="49" fill="#f87171" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">- applyManualPatch();</text>

      <!-- Right side (added) -->
      <rect x="170" y="0" width="160" height="26" rx="4" fill="url(#diff-add)" />
      <text x="178" y="17" fill="#34d399" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">+ const mode = "3-way";</text>

      <rect x="170" y="32" width="160" height="26" rx="4" fill="url(#diff-add)" />
      <text x="178" y="49" fill="#34d399" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">+ autoResolveDiff();</text>

      <!-- Context Lines -->
      <text x="8" y="85" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">  return &lt;DiffViewer /&gt;;</text>
      <text x="8" y="110" fill="#38bdf8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">✓ conflict resolved cleanly</text>
      <text x="8" y="135" fill="#a855f7" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">✦ ast-aware syntax highlighted</text>
    </g>

    <!-- Dynamic Scanning Bar Animation -->
    <rect class="scanner" x="15" y="40" width="330" height="3" rx="1.5" fill="#38bdf8" opacity="0.8" filter="url(#soft-glow)" />
  </g>

  <!-- Main Hero Titles & Content (Always Foreground & Crisp) -->
  <g transform="translate(460, 60)">
    <!-- Badge Pill -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="15" cy="15" r="4.5" fill="#10b981" />
    <text x="28" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">⚡ CURATED DEVTOOLS DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Awesome Git Utilities</text>
    <text x="0" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">&amp; Visual DIFF Tools 👁️</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Visual 2-Way &amp; 3-Way Merge GUIs • AST Semantic Diff Viewers • Terminal Pagers
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 195)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">3-Way Merge</text>

      <!-- Tag 2 -->
      <rect x="115" y="0" width="115" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="127" y="18" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">AST Semantic</text>

      <!-- Tag 3 -->
      <rect x="240" y="0" width="105" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="252" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">CLI &amp; GUIs</text>

      <!-- Tag 4 -->
      <rect x="355" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="367" y="18" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">SaaS &amp; Open Source</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
</svg>
